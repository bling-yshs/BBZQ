name: Build APK

on:
  push:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64-v8a
            abis: arm64-v8a
            suffix: arm64-v8a
          - label: armeabi-v7a
            abis: armeabi-v7a
            suffix: armv7a
          - label: uni
            abis: arm64-v8a,armeabi-v7a,x86_64
            suffix: uni
          - label: x86_64
            abis: x86_64
            suffix: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        run: |
          version=$(awk -F '=' '$1 == "releaseName" {print $2}' gradle.properties | tr -d '\r')
          count=$(git rev-list --count HEAD)
          echo "VERSION=$version-$count" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          cmdline-tools-version: 14742923
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Restore release keystore
        env:
          KEY_STORE: ${{ secrets.KEY_STORE || secrets.BBZQ_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.BBZQ_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS || secrets.BBZQ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.BBZQ_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_STORE" ]; then
            mkdir -p signing
            printf '%s' "$KEY_STORE" | base64 -d > signing/bbzq-key.p12
            cat <<EOF > signing.properties
          KEYSTORE_PASSWORD=$KEY_STORE_PASSWORD
          KEYSTORE_ALIAS=$ALIAS
          KEYSTORE_ALIAS_PASSWORD=${KEY_PASSWORD:-$KEY_STORE_PASSWORD}
          KEYSTORE_FILE=signing/bbzq-key.p12
          EOF
          fi

      - name: Restore linker guard source
        env:
          LINKER_GUARD_SOURCE_B64: ${{ secrets.LINKER_GUARD_SOURCE_B64 }}
        run: |
          if [ -n "$LINKER_GUARD_SOURCE_B64" ]; then
            printf '%s' "$LINKER_GUARD_SOURCE_B64" | base64 -d > app/src/main/java/io/github/bbzq/LinkerGuard.kt
          fi

      - name: Build APKs
        run: |
          tasks="assembleRelease"
          if [ "${{ matrix.label }}" = "uni" ]; then
            tasks="assembleDebug $tasks"
          fi
          sh ./gradlew --no-daemon --build-cache -PbbzqAbiFilters="${{ matrix.abis }}" -PbbzqOutputSuffix="${{ matrix.suffix }}" $tasks

      - name: Upload debug APK
        if: matrix.label == 'uni'
        uses: actions/upload-artifact@v4
        with:
          name: bbzq-${{ env.VERSION }}-uni-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bbzq-${{ env.VERSION }}-${{ matrix.label }}-release
          path: app/release/*.apk
          if-no-files-found: error
