name: 🛠️ 自动构建 (Auto Build)

on:
  push:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🛠️ 构建 arm64-v8a (Build arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 计算构建版本 (Compute Build Version)
        run: |
          version=$(awk -F '=' '$1 == "releaseName" {print $2}' gradle.properties | tr -d '\r')
          count=$(git rev-list --count HEAD)
          echo "VERSION=$version-$count" >> "$GITHUB_ENV"

      - name: 安装 Java (Install Java)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: 配置 Android SDK (Setup Android SDK)
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: ''

      - name: 安装 Android SDK 组件 (Install Android SDK Packages)
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: 恢复发布签名 (Restore Release Signing)
        env:
          KEY_STORE: ${{ secrets.KEY_STORE || secrets.BBZQ_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.BBZQ_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS || secrets.BBZQ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.BBZQ_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_STORE" ]; then
            mkdir -p signing
            printf '%s' "$KEY_STORE" | base64 -d > signing/bbzq-key.p12
            cat <<EOF > signing.properties
          KEYSTORE_PASSWORD=$KEY_STORE_PASSWORD
          KEYSTORE_ALIAS=$ALIAS
          KEYSTORE_ALIAS_PASSWORD=${KEY_PASSWORD:-$KEY_STORE_PASSWORD}
          KEYSTORE_FILE=signing/bbzq-key.p12
          EOF
          fi

      - name: 恢复 LinkerGuard 源码 (Restore LinkerGuard Source)
        env:
          LINKER_GUARD_SOURCE_B64: ${{ secrets.LINKER_GUARD_SOURCE_B64 }}
        run: |
          if [ -n "$LINKER_GUARD_SOURCE_B64" ]; then
            printf '%s' "$LINKER_GUARD_SOURCE_B64" | base64 -d > app/src/main/java/io/github/bbzq/LinkerGuard.kt
          fi

      - name: 授予 Gradle Wrapper 执行权限 (Grant Gradle Wrapper Execute Permission)
        run: chmod +x ./gradlew

      - name: 运行 build 构建 (Run Gradle Build)
        run: ./gradlew --no-daemon --build-cache -PbbzqAbiFilters=arm64-v8a -PbbzqOutputSuffix=arm64-v8a assembleRelease

      - name: 整理构建产物 (Prepare Build Artifacts)
        run: |
          shopt -s nullglob
          release_apks=(app/release/*.apk)
          if [ "${#release_apks[@]}" -ne 1 ]; then
            echo "::error::Expected one release APK, found ${#release_apks[@]}"
            exit 1
          fi
          mkdir -p artifacts/release
          cp "${release_apks[0]}" "artifacts/release/bbzq-${VERSION}-arm64-v8a-release.apk"

      - name: 上传构建产物 (Upload Build Artifacts)
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/release/*.apk
          archive: false
          if-no-files-found: error
